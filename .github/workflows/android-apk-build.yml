name: Android APK Build

on:
  push:
    branches:
      - build/shytalk-android-apk
      - feature/supabase-full-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shytalk-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" is a retired SDK package and makes setup-android fail.
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # Keep sdkmanager's exit code while avoiding yes(1)'s SIGPIPE
          # becoming a pipeline failure under GitHub's pipefail shell.
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK platform
        run: # API 37 is published on the Android SDK preview channel.
          sdkmanager --channel=3 "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify required local Firebase config
        run: |
          test -s app/src/local/google-services.json || {
            echo "::error::Missing app/src/local/google-services.json"
            exit 1
          }

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build local debug APK
        run: ./gradlew :app:assembleLocalDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShyTalk-local-debug-apk
          path: app/build/outputs/apk/local/debug/*.apk
          if-no-files-found: error
          retention-days: 14
