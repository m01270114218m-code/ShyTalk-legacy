name: Android APK Build

on:
  push:
    branches:
      - build/shytalk-android-apk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shytalk-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Build dev debug APK
        run: ./gradlew :app:assembleDevDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShyTalk-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14
